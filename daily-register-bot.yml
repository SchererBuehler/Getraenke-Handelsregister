name: Getränke-Handelsregister täglich

on:
  schedule:
    - cron: "15 7 * * *"
      timezone: "Europe/Zurich"
  workflow_dispatch:
    inputs:
      date:
        description: "Publikationsdatum (YYYY-MM-DD); leer = gestern"
        required: false
        type: string
      events:
        description: "Ereignisse, kommagetrennt"
        required: true
        default: "new,mutation,closure"
        type: string
      min_confidence:
        description: "Minimaler Branchen-Score"
        required: true
        default: "60"
        type: string
      enrich_contacts:
        description: "Kontakte von vorhandenen Firmenwebsites ergänzen"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: beverage-register-production
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_PATH: data/registry_bot.sqlite3
      EVENT_TYPES: ${{ inputs.events || 'new,mutation,closure' }}
      MIN_CONFIDENCE: ${{ inputs.min_confidence || '60' }}
      ENRICH_CONTACTS: ${{ github.event_name == 'schedule' && 'true' || inputs.enrich_contacts }}
      MAX_CONTACT_PAGES: "3"
      HTTP_TIMEOUT: "30"
      LOG_LEVEL: INFO
      USER_AGENT: CH-Beverage-Registry-Monitor/3.0 (GitHub Actions)
      TZ: Europe/Zurich

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Python installieren
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Laufdatum bestimmen
        id: run_date
        shell: bash
        run: |
          if [[ -n "${{ inputs.date }}" ]]; then
            RUN_DATE="${{ inputs.date }}"
          else
            RUN_DATE="$(date -d 'yesterday' +%F)"
          fi
          date -d "$RUN_DATE" +%F >/dev/null
          echo "date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "Verarbeite Publikationen vom $RUN_DATE"

      - name: Register-Bot ausführen
        shell: bash
        run: |
          mkdir -p data reports
          python bot.py \
            --date "${{ steps.run_date.outputs.date }}" \
            --events "$EVENT_TYPES" \
            --min-confidence "$MIN_CONFIDENCE" \
            --json > "reports/treffer-${{ steps.run_date.outputs.date }}.json"
          cat "reports/treffer-${{ steps.run_date.outputs.date }}.json"

      - name: Bericht als Workflow-Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: handelsregister-${{ steps.run_date.outputs.date }}-${{ github.run_number }}
          path: |
            reports/treffer-${{ steps.run_date.outputs.date }}.json
            data/registry_bot.sqlite3
          if-no-files-found: warn
          retention-days: 30

      - name: Datenbank und Bericht persistieren
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry_bot.sqlite3 "reports/treffer-${{ steps.run_date.outputs.date }}.json"
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu speichern."
          else
            git commit -m "Bot-Lauf ${{ steps.run_date.outputs.date }}"
            git push
          fi
