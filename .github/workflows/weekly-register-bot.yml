name: Getränke-Handelsregister wöchentlich

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "Optionales Enddatum YYYY-MM-DD; Standard: gestern"
        required: false
        type: string
  schedule:
    - cron: "15 7 * * 1"
      timezone: "Europe/Zurich"

permissions:
  contents: write

concurrency:
  group: weekly-register-bot
  cancel-in-progress: false

jobs:
  weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Berichtszeitraum bestimmen
        id: period
        shell: bash
        run: |
          if [ -n "${{ inputs.end_date }}" ]; then
            END_DATE="${{ inputs.end_date }}"
          else
            END_DATE="$(TZ=Europe/Zurich date -d yesterday +%F)"
          fi
          START_DATE="$(date -d "$END_DATE -6 days" +%F)"
          echo "start=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "Zeitraum: $START_DATE bis $END_DATE"

      - name: Publikationen der letzten sieben Tage verarbeiten
        env:
          ZEFIX_USERNAME: ${{ secrets.ZEFIX_USERNAME }}
          ZEFIX_PASSWORD: ${{ secrets.ZEFIX_PASSWORD }}
          DB_PATH: data/registry_bot.sqlite3
          ENRICH_CONTACTS: "true"
          MAX_CONTACT_PAGES: "3"
          USER_AGENT: ${{ vars.USER_AGENT || 'CH-Beverage-Registry-Monitor/2.0 (GitHub Actions)' }}
        shell: bash
        run: |
          mkdir -p reports exports data
          current="${{ steps.period.outputs.start }}"
          end="${{ steps.period.outputs.end }}"
          while [ "$current" != "$(date -d "$end +1 day" +%F)" ]; do
            echo "Verarbeite $current"
            python bot.py --date "$current" --json > "reports/treffer-$current.json"
            current="$(date -d "$current +1 day" +%F)"
          done

      - name: Wochen-Excel erstellen
        shell: bash
        run: |
          report_files=()
          current="${{ steps.period.outputs.start }}"
          end="${{ steps.period.outputs.end }}"
          while [ "$current" != "$(date -d "$end +1 day" +%F)" ]; do
            report_files+=("reports/treffer-$current.json")
            current="$(date -d "$current +1 day" +%F)"
          done
          python export_excel.py \
            --input "${report_files[@]}" \
            --output exports/treffer-${{ steps.period.outputs.start }}_bis_${{ steps.period.outputs.end }}.xlsx \
            --period "${{ steps.period.outputs.start }} bis ${{ steps.period.outputs.end }}"

      - name: Bericht als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: getraenke-register-${{ steps.period.outputs.start }}-bis-${{ steps.period.outputs.end }}
          path: |
            reports/treffer-*.json
            exports/treffer-${{ steps.period.outputs.start }}_bis_${{ steps.period.outputs.end }}.xlsx
          retention-days: 30

      - name: Datenbank und Berichte ins Repository schreiben
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry_bot.sqlite3 reports/ exports/
          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "Wochenbericht ${{ steps.period.outputs.start }} bis ${{ steps.period.outputs.end }}"
            git pull --rebase
            git push
          fi
