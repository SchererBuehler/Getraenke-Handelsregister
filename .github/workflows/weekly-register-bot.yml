name: Getränke-Handelsregister wöchentlich

on:
  schedule:
    - cron: "15 7 * * 1"
      timezone: "Europe/Zurich"
  workflow_dispatch:
    inputs:
      date:
        description: "Optionales Einzel-Datum (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: beverage-register-production
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZEFIX_USERNAME: ${{ secrets.ZEFIX_USERNAME }}
      ZEFIX_PASSWORD: ${{ secrets.ZEFIX_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_PATH: data/registry_bot.sqlite3
      EVENT_TYPES: new,mutation,closure
      MIN_CONFIDENCE: "60"
      ENRICH_CONTACTS: "true"
      MAX_CONTACT_PAGES: "3"
      TZ: Europe/Zurich

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Zugangsdaten prüfen
        run: |
          test -n "$ZEFIX_USERNAME" || (echo "ZEFIX_USERNAME fehlt" && exit 1)
          test -n "$ZEFIX_PASSWORD" || (echo "ZEFIX_PASSWORD fehlt" && exit 1)

      - name: Zeitraum bestimmen
        id: period
        shell: bash
        run: |
          mkdir -p data reports
          if [[ -n "${{ inputs.date }}" ]]; then
            date -d "${{ inputs.date }}" +%F >/dev/null
            echo "dates=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
            echo "label=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            DATES=""
            for OFFSET in 7 6 5 4 3 2 1; do
              DAY="$(date -d "$OFFSET days ago" +%F)"
              DATES="$DATES $DAY"
            done
            echo "dates=$DATES" >> "$GITHUB_OUTPUT"
            echo "label=$(date -d '7 days ago' +%F)_bis_$(date -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Sieben Tage verarbeiten
        shell: bash
        run: |
          for RUN_DATE in ${{ steps.period.outputs.dates }}; do
            echo "Verarbeite $RUN_DATE"
            python bot.py \
              --date "$RUN_DATE" \
              --events "$EVENT_TYPES" \
              --min-confidence "$MIN_CONFIDENCE" \
              --json > "reports/treffer-$RUN_DATE.json"
          done

      - name: Ergebnisse als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handelsregister-${{ steps.period.outputs.label }}-${{ github.run_number }}
          path: |
            reports/*.json
            data/registry_bot.sqlite3
          if-no-files-found: warn
          retention-days: 30

      - name: Datenbank und Berichte speichern
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry_bot.sqlite3 reports/*.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu speichern."
          else
            git commit -m "Wöchentlicher Bot-Lauf ${{ steps.period.outputs.label }}"
            git push
          fi
